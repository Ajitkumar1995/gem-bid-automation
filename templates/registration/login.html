{% extends "base.html" %}

{% block title %}Sign in · GeM Bid Workspace{% endblock %}

{% block content %}
<main class="shell login-shell"><section class="card"><p class="eyebrow">TENDER WORKSPACE</p><h1>Sign in</h1><p class="muted">Use your workspace account to manage bid documents.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label>Username {{ form.username }}</label><label>Password {{ form.password }}</label><button type="submit">Sign in</button><input type="hidden" name="next" value="{{ next }}"></form></section></main>
{% endblock %}
